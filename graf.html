<!doctype html>
<html lang="ca">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Amic Invisible · graf</title>
<link rel="stylesheet" href="https://esm.sh/@xyflow/react@12.3.6/dist/style.css" />
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { font-family: system-ui, sans-serif; background: #f6f7f6; color: #16181a; }
  .panel { background: #fff; border: 1px solid #d9dfdb; border-radius: 12px; padding: 12px 16px; max-width: 280px; font-size: 14px; line-height: 1.45; }
  .panel h1 { margin: 0 0 6px; font-size: 16px; }
  .panel button { margin-top: 10px; padding: 8px 16px; border: 0; border-radius: 999px; background: #16181a; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .persona { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px; }
  .persona .react-flow__handle { top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import React, { useState } from 'https://esm.sh/react@18.3.1'
import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client'
import { ReactFlow, Background, Panel, Handle, Position, BaseEdge, MarkerType }
  from 'https://esm.sh/@xyflow/react@12.3.6?deps=react@18.3.1,react-dom@18.3.1'

const h = React.createElement
// Real groups if present (gitignored), otherwise the fake example ones.
const GRUPS = await fetch('grups.json').then((r) => (r.ok ? r.json() : Promise.reject()))
  .catch(() => fetch('grups.example.json').then((r) => r.json()))
const COLORS = ['#1d6b4a', '#2b5fb0', '#b0502b', '#7a3fa0']
const R = 38 // node radius

const grup = {}
GRUPS.forEach((g, i) => g.forEach((n) => (grup[n] = i)))
const noms = Object.keys(grup)

const shuffle = (a) => {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1))
    ;[a[i], a[j]] = [a[j], a[i]]
  }
  return a
}

// Same idea as sorteig.py: randomized backtracking for a Hamiltonian cycle.
function cicle() {
  const cerca = (cami) => {
    const last = cami[cami.length - 1]
    if (cami.length === noms.length) return grup[last] !== grup[cami[0]] ? cami : null
    for (const v of shuffle(noms.filter((n) => grup[n] !== grup[last] && !cami.includes(n)))) {
      const r = cerca([...cami, v])
      if (r) return r
    }
    return null
  }
  return cerca([shuffle([...noms])[0]])
}

// Nodes on a circle, groups kept together with a gap between them.
const slots = noms.length + GRUPS.length
let slot = 0
const nodes = GRUPS.flatMap((g, gi) => {
  const out = g.map((n) => {
    const a = (slot++ / slots) * 2 * Math.PI - Math.PI / 2
    return {
      id: n, type: 'persona', data: { color: COLORS[gi] }, draggable: true,
      position: { x: 330 * Math.cos(a) - R, y: 330 * Math.sin(a) - R },
    }
  })
  slot++
  return out
})

function Persona({ id, data }) {
  return h('div', { className: 'persona', style: { background: data.color } },
    id,
    h(Handle, { type: 'source', position: Position.Top }),
    h(Handle, { type: 'target', position: Position.Top }))
}

// Straight edge between node centres, trimmed so arrowheads stop at the circle.
function Recta({ sourceX, sourceY, targetX, targetY, markerEnd, style }) {
  const dx = targetX - sourceX, dy = targetY - sourceY
  const d = Math.hypot(dx, dy) || 1
  const ux = dx / d, uy = dy / d
  const path = `M${sourceX + ux * R},${sourceY + uy * R} L${targetX - ux * (R + 4)},${targetY - uy * (R + 4)}`
  return h(BaseEdge, { path, markerEnd, style })
}

const nodeTypes = { persona: Persona }
const edgeTypes = { recta: Recta }

function edgesFor(c) {
  const possibles = []
  noms.forEach((a, i) => noms.slice(i + 1).forEach((b) => {
    if (grup[a] !== grup[b]) possibles.push({
      id: `p-${a}-${b}`, source: a, target: b, type: 'recta', selectable: false,
      style: { stroke: '#c3cbc6', strokeWidth: 1 },
    })
  }))
  const regals = c.map((a, i) => ({
    id: `c-${a}`, source: a, target: c[(i + 1) % c.length], type: 'recta', zIndex: 1,
    style: { stroke: '#16181a', strokeWidth: 3 },
    markerEnd: { type: MarkerType.ArrowClosed, color: '#16181a' },
  }))
  return [...possibles, ...regals]
}

function App() {
  const [c, setC] = useState(cicle)
  return h(ReactFlow, {
    defaultNodes: nodes, edges: edgesFor(c), nodeTypes, edgeTypes,
    fitView: true, nodesConnectable: false, proOptions: { hideAttribution: false },
  },
    h(Background),
    h(Panel, { position: 'top-left' },
      h('div', { className: 'panel' },
        h('h1', null, 'Amic Invisible · graf'),
        h('div', null, 'Línies grises: qui pot regalar a qui (grups diferents). Fletxes negres: un cicle hamiltonià ',
          h('strong', null, "d'exemple"), ', no el sorteig real.'),
        h('button', { onClick: () => setC(cicle()) }, 'Un altre cicle'))))
}

createRoot(document.getElementById('root')).render(h(App))
</script>
</body>
</html>
